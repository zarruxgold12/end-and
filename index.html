<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yulduzlarni ushla</title>
<style>
:root{--bg:#0f1b3d;--panel:#16264f;--star:#ffd23f;--rock:#ff6b6b;--ok:#3ddc97;--text:#f5f7ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px;gap:12px}
h1{margin:0;font-size:1.6rem}
.bar{display:flex;justify-content:space-between;width:100%;max-width:520px;font-size:1.1rem}
.bar b{color:var(--star)}
#arena{position:relative;width:100%;max-width:520px;flex:1;min-height:320px;max-height:640px;background:var(--panel);border-radius:16px;overflow:hidden;touch-action:manipulation}
.t{position:absolute;width:56px;height:56px;border:0;background:none;font-size:42px;line-height:1;cursor:pointer;padding:0;animation:pop .15s ease-out}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:rgba(15,27,61,.92)}
#msg p{margin:0;max-width:30ch;line-height:1.5}
.go{font:inherit;font-weight:700;background:var(--star);color:#1a1a1a;border:0;border-radius:999px;padding:12px 28px;cursor:pointer}
button:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.t{animation:none}}
</style>
</head>
<body>
<h1>Yulduzlarni ushla</h1>
<div class="bar">
  <span>Ball: <b id="score">0</b></span>
  <span>Vaqt: <b id="time">30</b></span>
  <span>Rekord: <b id="best">0</b></span>
</div>
<div id="arena">
  <div id="msg">
    <p id="msgText">⭐ ni bos: +1 ball.<br>☄️ ga tegma: −3 ball.<br>Vaqting 30 soniya.</p>
    <button class="go" id="start" type="button">Boshlash</button>
  </div>
</div>
<script>
(function () {
  var arena = document.getElementById('arena');
  var msg = document.getElementById('msg');
  var msgText = document.getElementById('msgText');
  var startBtn = document.getElementById('start');
  var scoreEl = document.getElementById('score');
  var timeEl = document.getElementById('time');
  var bestEl = document.getElementById('best');
  var score = 0, time = 30, running = false, spawnTimer, clockTimer, best = 0;

  try { best = +localStorage.getItem('yulduz-rekord') || 0; } catch (e) {}
  bestEl.textContent = best;

  function clearTargets() {
    var items = arena.querySelectorAll('.t');
    for (var i = 0; i < items.length; i++) items[i].remove();
  }

  function spawn() {
    if (!running) return;
    var bad = Math.random() < 0.25;
    var b = document.createElement('button');
    b.className = 't';
    b.type = 'button';
    b.textContent = bad ? '☄️' : '⭐';
    b.setAttribute('aria-label', bad ? 'Tosh' : 'Yulduz');
    b.style.left = Math.random() * (arena.clientWidth - 56) + 'px';
    b.style.top = Math.random() * (arena.clientHeight - 56) + 'px';
    b.onclick = function () {
      score = Math.max(0, score + (bad ? -3 : 1));
      scoreEl.textContent = score;
      b.remove();
    };
    arena.appendChild(b);
    setTimeout(function () { b.remove(); }, bad ? 1500 : 1100);
    spawnTimer = setTimeout(spawn, 350 + Math.random() * 350);
  }

  function start() {
    clearTargets();
    score = 0; time = 30; running = true;
    scoreEl.textContent = 0;
    timeEl.textContent = 30;
    msg.style.display = 'none';
    clockTimer = setInterval(function () {
      time--;
      timeEl.textContent = time;
      if (time <= 0) end();
    }, 1000);
    spawn();
  }

  function end() {
    running = false;
    clearInterval(clockTimer);
    clearTimeout(spawnTimer);
    clearTargets();
    var text = 'Vaqt tugadi! Balling: ' + score + '.';
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      text += ' Yangi rekord!';
      try { localStorage.setItem('yulduz-rekord', best); } catch (e) {}
    }
    msgText.textContent = text;
    startBtn.textContent = 'Qaytadan o‘ynash';
    msg.style.display = 'flex';
  }

  startBtn.onclick = start;
})();
</script>
</body>
</html>
